<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090c">
<title>APEX — Live Your Moment</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#08090c;
  color:#fff;
  overflow:hidden;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* =========================
   TOP BAR
========================= */

.top{
  height:62px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 18px;
  background:#08090cdd;
  backdrop-filter:blur(15px);
  border-bottom:1px solid #292c34;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#ff5a1f;
}

.tabs{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:25px;
}

.tabs button{
  background:none;
  color:#aaa;
  padding:20px 3px;
  font-weight:bold;
}

.tabs button.active{
  color:#fff;
  border-bottom:2px solid #fff;
}

.search{
  margin-left:auto;
  width:240px;
}

.search input{
  width:100%;
  background:#1d1f25;
  border:1px solid #30323a;
  color:#fff;
  padding:10px 15px;
  border-radius:25px;
  outline:none;
}

.top-icon{
  width:39px;
  height:39px;
  border-radius:50%;
  background:#1d1f25;
  color:#fff;
}

.profile{
  width:39px;
  height:39px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #444;
}

/* =========================
   FEED
========================= */

.feed{
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  padding-top:62px;
  scrollbar-width:none;
}

.feed::-webkit-scrollbar{
  display:none;
}

.post{
  height:calc(100vh - 62px);
  min-height:580px;
  position:relative;
  scroll-snap-align:start;
  display:flex;
  justify-content:center;
  background:#111;
  overflow:hidden;
}

.post video,
.post img{
  width:100%;
  max-width:720px;
  height:100%;
  object-fit:cover;
}

.post video{
  background:#000;
}

.post:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 42%,
    rgba(0,0,0,.88)
  );
  pointer-events:none;
}

/* =========================
   POST INFORMATION
========================= */

.info{
  position:absolute;
  z-index:5;
  left:max(18px,calc(50% - 330px));
  bottom:25px;
  width:min(500px,70%);
  text-shadow:0 2px 8px #000;
}

.username{
  font-size:18px;
  font-weight:900;
  margin-bottom:8px;
}

.handle{
  color:#ddd;
  font-size:14px;
  font-weight:normal;
  margin-left:4px;
}

.caption{
  font-size:15px;
  line-height:1.5;
}

.sound{
  margin-top:10px;
  font-size:13px;
  font-weight:bold;
}

/* =========================
   ACTIONS
========================= */

.actions{
  position:absolute;
  z-index:10;
  right:max(12px,calc(50% - 350px));
  bottom:25px;
  display:flex;
  flex-direction:column;
  gap:14px;
  align-items:center;
}

.creator{
  width:54px;
  height:54px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #fff;
}

.follow{
  background:#ff5a1f;
  color:#fff;
  border-radius:20px;
  padding:5px 9px;
  font-size:11px;
  font-weight:bold;
  margin-top:-20px;
}

.follow.following{
  background:#fff;
  color:#111;
}

.action{
  background:none;
  color:#fff;
  text-align:center;
  text-shadow:0 2px 7px #000;
}

.circle{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#171920dd;
  display:grid;
  place-items:center;
  font-size:22px;
}

.action b{
  display:block;
  font-size:11px;
  margin-top:4px;
}

.liked{
  color:#ff5a1f!important;
}

/* =========================
   CREATE BUTTON
========================= */

.create{
  position:fixed;
  z-index:60;
  right:25px;
  bottom:25px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#ff5a1f;
  color:#fff;
  font-size:30px;
  box-shadow:0 10px 30px #0008;
}

/* =========================
   MODALS
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#000c;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.box{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:#15171c;
  border:1px solid #333640;
  border-radius:20px;
  padding:20px;
}

.close{
  float:right;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#292c33;
  color:#fff;
}

.box h2{
  margin-bottom:15px;
}

.box p{
  line-height:1.5;
}

.box textarea,
.box input,
.box select{
  width:100%;
  background:#202229;
  color:#fff;
  border:1px solid #363944;
  padding:12px;
  border-radius:11px;
  margin:6px 0;
  outline:none;
}

.box input::placeholder,
.box textarea::placeholder{
  color:#888;
}

.tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0;
}

.tool{
  background:#292c33;
  color:#fff;
  padding:9px 12px;
  border-radius:10px;
}

.primary{
  width:100%;
  background:#ff5a1f;
  color:#fff;
  padding:13px;
  border-radius:11px;
  font-weight:bold;
  margin-top:8px;
}

.preview{
  width:100%;
  max-height:280px;
  object-fit:cover;
  border-radius:12px;
  display:none;
  margin-top:8px;
  background:#000;
}

/* =========================
   COMMENTS
========================= */

.comments{
  display:none;
  flex-direction:column;
  position:fixed;
  z-index:120;
  right:0;
  top:0;
  bottom:0;
  width:min(420px,100%);
  background:#15171c;
  border-left:1px solid #333;
}

.comment-header{
  padding:18px;
  border-bottom:1px solid #333;
  font-weight:bold;
}

.comment-list{
  flex:1;
  overflow:auto;
  padding:15px;
}

.comment{
  padding:11px 0;
  border-bottom:1px solid #292c34;
  line-height:1.45;
}

.comment-input{
  display:flex;
  gap:7px;
  padding:12px;
}

.comment-input input{
  flex:1;
  background:#22242b;
  border:0;
  color:#fff;
  border-radius:20px;
  padding:10px;
  outline:none;
}

.comment-input button{
  background:#ff5a1f;
  color:#fff;
  border-radius:20px;
  padding:9px 14px;
}

/* =========================
   PROFILE PANEL
========================= */

.profile-panel{
  display:none;
  position:fixed;
  z-index:130;
  top:62px;
  right:15px;
  width:min(360px,calc(100% - 30px));
  background:#15171c;
  border:1px solid #333640;
  border-radius:18px;
  padding:18px;
  box-shadow:0 15px 40px #0008;
}

.profile-head{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:15px;
}

.profile-large{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
}

.profile-panel .primary{
  margin-top:12px;
}

/* =========================
   AUDIO CONTROL
========================= */

.sound-button{
  position:absolute;
  z-index:15;
  right:18px;
  top:18px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#171920cc;
  color:#fff;
  font-size:19px;
}

/* =========================
   TOAST
========================= */

.toast{
  display:none;
  position:fixed;
  z-index:200;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  color:#111;
  padding:11px 17px;
  border-radius:25px;
  box-shadow:0 8px 30px #0007;
  max-width:90%;
  text-align:center;
}

/* =========================
   MOBILE
========================= */

.mobile{
  display:none;
}

    padding:0 10px;

    font-size:13px;

  }
