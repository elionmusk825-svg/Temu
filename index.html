<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090c">
<meta name="description" content="APEX — Live Your Moment">
<title>APEX — Live Your Moment</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#08090c;
  color:#fff;
  overflow:hidden;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

button:active{
  transform:scale(.96);
}

/* =========================
   TOP BAR
========================= */

.top{
  height:62px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 18px;
  background:#08090cee;
  backdrop-filter:blur(18px);
  border-bottom:1px solid #292c34;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span{
  color:#ff5a1f;
}

.tabs{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:25px;
}

.tabs button{
  background:none;
  color:#999;
  padding:20px 3px;
  font-weight:bold;
}

.tabs button.active{
  color:#fff;
  border-bottom:2px solid #fff;
}

.search{
  margin-left:auto;
  width:240px;
}

.search input{
  width:100%;
  background:#1d1f25;
  border:1px solid #30323a;
  color:#fff;
  padding:10px 15px;
  border-radius:25px;
  outline:none;
}

.top-icon{
  width:39px;
  height:39px;
  border-radius:50%;
  background:#1d1f25;
  color:#fff;
}

.profile{
  width:39px;
  height:39px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #444;
}

/* =========================
   FEED
========================= */

.feed{
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  padding-top:62px;
  scrollbar-width:none;
}

.feed::-webkit-scrollbar{
  display:none;
}

.post{
  height:calc(100vh - 62px);
  min-height:580px;
  position:relative;
  scroll-snap-align:start;
  display:flex;
  justify-content:center;
  background:#111;
  overflow:hidden;
}

.post video,
.post img{
  width:100%;
  max-width:720px;
  height:100%;
  object-fit:cover;
}

.post video{
  background:#000;
}

.post:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 40%,
    rgba(0,0,0,.92)
  );
  pointer-events:none;
}

/* =========================
   POST INFORMATION
========================= */

.info{
  position:absolute;
  z-index:5;
  left:max(18px,calc(50% - 330px));
  bottom:25px;
  width:min(510px,70%);
  text-shadow:0 2px 8px #000;
}

.username{
  font-size:18px;
  font-weight:900;
  margin-bottom:8px;
}

.handle{
  color:#ddd;
  font-size:14px;
  font-weight:normal;
}

.caption{
  font-size:15px;
  line-height:1.5;
  margin-top:3px;
}

.sound{
  margin-top:10px;
  font-size:13px;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:6px;
}

/* =========================
   ACTIONS
========================= */

.actions{
  position:absolute;
  z-index:10;
  right:max(12px,calc(50% - 350px));
  bottom:25px;
  display:flex;
  flex-direction:column;
  gap:13px;
  align-items:center;
}

.creator{
  width:54px;
  height:54px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #fff;
}

.follow{
  background:#ff5a1f;
  color:#fff;
  border-radius:20px;
  padding:5px 9px;
  font-size:11px;
  font-weight:bold;
  margin-top:-20px;
}

.following{
  background:#fff;
  color:#111;
}

.action{
  background:none;
  color:#fff;
  text-align:center;
  text-shadow:0 2px 7px #000;
}

.circle{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#171920dd;
  display:grid;
  place-items:center;
  font-size:22px;
}

.action b{
  display:block;
  font-size:11px;
  margin-top:4px;
}

.liked{
  color:#ff5a1f!important;
}

.saved{
  color:#ffb000!important;
}

/* =========================
   CREATE BUTTON
========================= */

.create{
  position:fixed;
  z-index:60;
  right:25px;
  bottom:25px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#ff5a1f;
  color:#fff;
  font-size:30px;
  box-shadow:0 10px 30px #0008;
}

/* =========================
   MODALS
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#000c;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.box{
  width:min(570px,100%);
  max-height:90vh;
  overflow:auto;
  background:#15171c;
  border:1px solid #333640;
  border-radius:20px;
  padding:20px;
  box-shadow:0 25px 70px #000;
}

.close{
  float:right;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#292c33;
  color:#fff;
}

.box h2{
  margin-bottom:15px;
}

.box p{
  line-height:1.5;
}

.box textarea,
.box input,
.box select{
  width:100%;
  background:#202229;
  color:#fff;
  border:1px solid #363944;
  padding:12px;
  border-radius:11px;
  margin:6px 0;
  outline:none;
}

.box input[type="file"]{
  padding:10px;
}

.tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0;
}

.tool{
  background:#292c33;
  color:#fff;
  padding:9px 12px;
  border-radius:10px;
}

.primary{
  width:100%;
  background:#ff5a1f;
  color:#fff;
  padding:13px;
  border-radius:11px;
  font-weight:bold;
  margin-top:8px;
}

.secondary{
  width:100%;
  background:#292c33;
  color:#fff;
  padding:13px;
  border-radius:11px;
  font-weight:bold;
  margin-top:8px;
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px;
  display:none;
  margin-top:8px;
  background:#000;
}

/* =========================
   COMMENTS
========================= */

.comments{
  display:none;
  flex-direction:column;
  position:fixed;
  z-index:120;
  right:0;
  top:0;
  bottom:0;
  width:min(430px,100%);
  background:#15171c;
  border-left:1px solid #333;
}

.comment-header{
  padding:18px;
  border-bottom:1px solid #333;
  font-weight:bold;
}

.comment-list{
  flex:1;
  overflow:auto;
  padding:15px;
}

.comment{
  padding:13px 0;
  border-bottom:1px solid #292c34;
}

.comment small{
  color:#999;
}

.comment-input{
  display:flex;
  gap:7px;
  padding:12px;
}

.comment-input input{
  flex:1;
  background:#22242b;
  border:0;
  color:#fff;
  border-radius:20px;
  padding:10px;
  outline:none;
}

.comment-input button{
  background:#ff5a1f;
  color:#fff;
  border-radius:20px;
  padding:9px 14px;
}

/* =========================
   PROFILE PANEL
========================= */

.profile-panel{
  display:none;
  position:fixed;
  z-index:110;
  right:15px;
  top:70px;
  width:min(350px,calc(100% - 30px));
  background:#15171c;
  border:1px solid #333640;
  border-radius:18px;
  padding:18px;
  box-shadow:0 20px 60px #000;
}

.profile-head{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:15px;
}

.profile-large{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
}

.profile-name{
  font-size:19px;
  font-weight:bold;
}

.profile-handle{
  color:#999;
  margin-top:4px;
}

/* =========================
   DISCOVER
========================= */

.discover{
  display:none;
  position:fixed;
  z-index:80;
  inset:62px 0 0;
  background:#08090c;
  overflow:auto;
  padding:20px;
}

.discover h2{
  margin-bottom:15px;
}

.discover-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  max-width:900px;
  margin:auto;
}

.discover-item{
  aspect-ratio:1/1.3;
  background:#181a20;
  overflow:hidden;
  position:relative;
}

.discover-item img,
.discover-item video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =========================
   TOAST
========================= */

.toast{
  display:none;
  position:fixed;
  z-index:300;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  color:#111;
  padding:11px 17px;
  border-radius:25px;
  font-weight:bold;
  box-shadow:0 10px 30px #0008;
}

/* =========================
   LOADING
========================= */

.loading{
  position:fixed;
  inset:0;
  z-index:500;
  background:#08090c;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:15px;
}

.loading-logo{
  font-size:42px;
  font-weight:900;
}

.loading-logo span{
  color:#ff5a1f;
}

.spinner{
  width:35px;
  height:35px;
  border:4px solid #333;
  border-top-color:#ff5a1f;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* =========================
   MOBILE
========================= */

.mobile{
  display:none;
}

@media(max-width:700px){

  .top{
    padding:0 10px;
  }

  .search{
    display:none;
  }

  .tabs{
    gap:15px;
  }

  .tabs button{
    font-size:13px;
  }

  .logo{
    font-size:23px;
  }

  .post{
    height:calc(100vh - 62px);
  }

  .info{
    left:14px;
    bottom:80px;
    width:72%;
  }

  .actions{
    right:10px;
    bottom:80px;
  }

  .create{
    right:16px;
    bottom:75px;
  }

  .mobile{
    position:fixed;
    display:flex;
    z-index:55;
    bottom:0;
    left:0;
    right:0;
    height:60px;
    background:#090a0d;
    border-top:1px solid #292c34;
    justify-content:space-around;
    align-items:center;
  }

  .mobile button{
    background:none;
    color:#fff;
    font-size:18px;
  }

  .mobile small{
    display:block;
    font-size:9px;
  }

  .discover{
    bottom:60px;
  }

  .discover-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div class="loading" id="loading">

  <div class="loading-logo">
    <span>◆</span> APEX
  </div>

  <div class="spinner"></div>

  <div style="color:#888">
    Loading your world...
  </div>

</div>

<!-- =========================
     TOP BAR
========================= -->

<header class="top">

  <div class="logo">
    <span>◆</span> APEX
  </div>

  <div class="tabs">

    <button
      id="forYouTab"
      class="active"
      onclick="changeFeed(this,'forYou')">

    </button>

    <button
      id="followingTab"

<!-- =========================
     FEED
========================= -->

<main

  id="feed">
</main>

<!-- =========================
     CREATE
========================= -->

<button

  ＋
</button>

<!-- =========================
     MOBILE NAV
========================= -->

<nav class="mobile">

  <button onclick="showHome()">

  </button>

  <button onclick="showDiscover()">
    🔎
    <small>Discover</small>
  </button>

  <button onclick="openCreate()">
    ＋
    <small>Create</small>
  </button>

  <button onclick="openInbox()">
    ✉
    <small>Inbox</small>
  </button>

  <button onclick="toggleProfile()">
    👤
    <small>Profile</small>
  </button>

</nav>

<!-- =========================
     CREATE POST MODAL
========================= -->

<div
  class="modal"
  id="createModal">

  <div class="box">

    <button
      class="close"
      onclick="closeCreate()">
      ×
    </button>

    <h2>Create your APEX moment</h2>

    <p style="color:#999;margin-bottom:10px">
      Upload a photo or video and publish it to APEX.
    </p>

    <input
      type="file"
      id="file"

      onchange="previewFile(event)">

    <video
      id="videoPreview"
      class="preview"
      controls
      playsinline>
    </video>

    <img
      id="imagePreview"
      class="preview">

    <div class="tools">

      <button
        class="tool"
        onclick="openCamera()">
        📷 Camera
      </button>

      <button
        class="tool"
        onclick="playSelectedSound()">
        🎵 Sound
      </button>

      <button
        class="tool"
        onclick="toast('Effects ready ✨')">
        ✨ Effects
      </button>

      <button
        class="tool"
        onclick="toast('Text tool ready')">
        Aa Text
      </button>

    </div>

    <select id="filter">

      <option value="Original">

      <option value="Warm Glow">

    <button

</div>

<!-- =========================
     AUTH MODAL
========================= -->

<div
  class="modal"
  id="authModal">

  <div class="box">

    <button
      class="close"
      onclick="closeAuth()">
      ×
    </button>

    <h2 id="authTitle">
      Join APEX
    </h2>

    <p
      id="authMessage"

      Already have an account? Log in
    </button>

    <button
      class="tool"
      style="width:100%;margin-top:8px"
      onclick="logout()">
      Sign out
    </button>

  </div>

</div>

<!-- =========================
     PROFILE PANEL
========================= -->

<div
  class="profile-panel"
  id="profilePanel">

  <div class="profile-head">

    <img
      class="profile-large"
      id="profileLarge"
      src="https://i.pravatar.cc/100?img=12">

    <div>

      <div
        class="profile-name"
        id="profileName">

  <button

  </button>

<!-- =========================
     COMMENTS
========================= -->

<div
  class="comments"
  id="commentsPanel">

  <div class="comment-header">

    Comments

    <button
      class="close"
      onclick="closeComments()">
      ×
    </button>

  </div>

  <div
    class="comment-list"
    id="commentList">
  </div>

  <div class="comment-input">

    <input
      id="commentInput"
      placeholder="Add a comment..."

    <button
      onclick="sendComment()">
      Send
    </button>

  </div>

</div>

<!-- =========================
     DISCOVER
========================= -->

<section
  class="discover"

  <div

  </div>

<!-- =========================
     SUPABASE CLIENT
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   APEX SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
"https://myzhieghlnjckdqgoidg.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_oMEr47Dj8lGm51yAuv-FEg_z_TAm3ON";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================================
   PAYSTACK
========================================================= */

const PAYSTACK_LINK =
"https://paystack.shop/pay/kkof1e1670";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_BUCKET =
"post-media";


/* =========================================================
   STATE
========================================================= */

let posts = [];

let currentUser = null;

let currentProfile = null;

let currentPost = null;

let currentFeedType = "forYou";

let authLoginMode = false;

let nextLocalId = 100000;

let localLikes = {};

let localSaves = {};

let localFollows = {};

let previewObjectURL = null;


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   NUMBER FORMAT
========================================================= */

function formatNumber(number){

  number = Number(number || 0);

  if(number >= 1000000){
    return (number / 1000000).toFixed(1) + "M";
  }

  if(number >= 1000){
    return (number / 1000).toFixed(1) + "K";
  }

  return number;
}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

  const box =
    document.getElementById("toastBox");

  box.textContent = message;

  box.style.display = "block";

  clearTimeout(window.apexToastTimer);

  window.apexToastTimer =
    setTimeout(() => {
      box.style.display = "none";
    },2200);
}


/* =========================================================
   GET POST
========================================================= */

function findPost(id){

  return posts.find(
    post => String(post.id) === String(id)
  );

}


/* =========================================================
   OPEN / CLOSE CREATE
========================================================= */

function openCreate(){

  document
    .getElementById("createModal")
    .style.display = "flex";

}

function closeCreate(){

  document
    .getElementById("createModal")
    .style.display = "none";

}


/* =========================================================
   AUTH UI
========================================================= */

function openAuth(){

  document
    .getElementById("authModal")
    .style.display = "flex";

  document
    .getElementById("profilePanel")
    .style.display = "none";

}

function closeAuth(){

  document
    .getElementById("authModal")
    .style.display = "none";

}

function toggleAuthMode(){

  authLoginMode = !authLoginMode;

  const title =
    document.getElementById("authTitle");

  const message =
    document.getElementById("authMessage");

  const button =
    document.getElementById("authButton");

  const switchButton =
    document.getElementById("authSwitch");

  const name =
    document.getElementById("authName");

  const username =
    document.getElementById("authUsername");

  if(authLoginMode){

    title.textContent = "Welcome back";

    message.textContent =
      "Log in to your APEX account.";

    button.textContent = "Log In";

    switchButton.textContent =
      "Need an account? Sign up";

    name.style.display = "none";

    username.style.display = "none";

  }else{

    title.textContent = "Join APEX";

    message.textContent =
      "Create your APEX account.";

    button.textContent = "Create Account";

    switchButton.textContent =
      "Already have an account? Log in";

    name.style.display = "block";

    username.style.display = "block";

  }

}


/* =========================================================
   AUTHENTICATION
========================================================= */

async function handleAuth(){

  const email =
    document.getElementById("authEmail")
    .value.trim();

  const password =
    document.getElementById("authPassword")
    .value;

  if(!email || !password){

    toast("Enter your email and password.");

    return;
  }

  try{

    if(authLoginMode){

      const {data,error} =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if(error) throw error;

      currentUser =
        data.user;

      toast("Welcome back to APEX 🚀");

      closeAuth();

      await loadCurrentProfile();

      await loadPosts();

      return;
    }


    const displayName =
      document
        .getElementById("authName")
        .value.trim()
        || "APEX User";


    let username =
      document
        .getElementById("authUsername")
        .value.trim()
        .toLowerCase()
        .replace(/[^a-z0-9_]/g,"");


    if(!username){

      username =
        "apex_" +
        Math.floor(
          Math.random()*100000
        );

    }


    const {data,error} =
      await supabaseClient.auth.signUp({

        email,
        password,

        options:{
          data:{
            display_name:displayName,
            username:username
          }
        }

      });


    if(error) throw error;

    currentUser =
      data.user || null;

    if(currentUser){

      await createOrUpdateProfile(
        currentUser,
        displayName,
        username
      );

    }

    toast(
      "Account created. Check your email if confirmation is required."
    );

    closeAuth();

    await loadCurrentProfile();

    await loadPosts();

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Authentication failed."
    );

  }

}

/* =========================================================
   DATABASE POSTS
========================================================= */

async function loadPosts(){

  try{

    const {data,error} =
      await supabaseClient
      .from("posts")
      .select("*")
      .order("created_at",{
        ascending:false
      })
      .limit(100);


    if(error){

      console.warn(
        "Posts database warning:",
        error
      );

      return;

    }


    if(!data){

      return;

    }


    const databasePosts =
      data.map(row => {

        return {

          id:row.id,

          user_id:
            row.user_id
            || row.author_id
            || null,

          name:
            row.display_name
            || row.name
            || "APEX Creator",

          handle:
            row.username
            ? "@" + String(row.username).replace(/^@/,"")
            : "@apex_creator",

          avatar:
            row.avatar_url
            || "https://i.pravatar.cc/100?img=12",

          caption:
            row.caption
            || "",

          media:
            row.media_url
            || row.video_url
            || row.image_url
            || row.media
            || "",

          video:
            row.media_type === "video"
            || row.video === true
            || (
              typeof row.media_url === "string"
              &&
              /\.(mp4|webm|mov|m4v)(\?|$)/i
                .test(row.media_url)
            ),

          sound:
            row.sound_name
            || row.sound
            || "APEX Original Sound",

          likes:
            Number(
              row.likes_count
              || row.like_count
              || row.likes
              || 0
            ),

          comments:
            [],

          following:false,

          saved:false

        };

      });


    posts =
      databasePosts;

    renderFeed();

    renderDiscover();

  }catch(error){

    console.warn(error);

  }

}

/* =========================================================
   VIDEO PLAYBACK
========================================================= */

function setupVideoPlayback(){

  const videos =
    document.querySelectorAll(
      ".post video"
    );


  const observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(entry => {

          const video =
            entry.target;


          if(entry.isIntersecting){

            video.play()
              .catch(() => {});

          }else{

            video.pause();

          }

        });

      },
      {
        threshold:.65
      }
    );


  videos.forEach(video => {

    observer.observe(video);

  });

}

/* =========================================================
   UPLOAD MEDIA
========================================================= */

async function uploadMedia(file){

  if(!currentUser){

    throw new Error(
      "You must log in before uploading."
    );

  }


  const extension =
    (
      file.name.split(".").pop()
      || "bin"
    )
    .toLowerCase();


  const path =
    currentUser.id
    + "/"
    + Date.now()
    + "_"
    + Math.random()
        .toString(36)
        .slice(2)
    + "."
    + extension;


  const {error} =
    await supabaseClient
    .storage
    .from(STORAGE_BUCKET)
    .upload(
      path,
      file,
      {
        cacheControl:"3600",
        upsert:false,
        contentType:file.type
      }
    );


  if(error){

    throw error;

  }


  const {data} =
    supabaseClient
      .storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(path);


  return data.publicUrl;

}

    );


    stream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

  }catch(error){

    toast(
      "Camera permission was not granted."
    );

  }

}


/* =========================================================
   SOUND
========================================================= */

function playSelectedSound(){

  const soundName =
    document
      .getElementById("sound")
      .value
      .trim();


  if(!soundName){

    toast(
      "Enter a sound/music name first 🎵"
    );

    return;

  }


  toast(
    "Sound selected: " +
    soundName
  );

}


/* =========================================================
   DISCOVER
========================================================= */

function showDiscover(){

  document
    .getElementById("discover")
    .style.display = "block";


  renderDiscover();

}


function renderDiscover(){

  const grid =
    document
      .getElementById("discoverGrid");


  grid.innerHTML = "";


  posts.slice(0,30)
    .forEach(post => {

      const item =
        document.createElement("div");


      item.className =
        "discover-item";


      if(post.video){

        item.innerHTML = `

          <video
            src="${escapeHTML(post.media)}"
            muted
            playsinline>
          </video>

        `;

      }else{

        item.innerHTML = `

          <img
            src="${escapeHTML(post.media)}"
            alt="APEX discovery">

        `;

      }


      item.onclick = () => {

        document
          .getElementById("discover")
          .style.display =
            "none";


        const index =
          posts.findIndex(
            p =>
              String(p.id)
              === String(post.id)
          );


        renderFeed();


        setTimeout(() => {

          const sections =
            document.querySelectorAll(
              ".post"
            );


          if(sections[index]){

            sections[index]
              .scrollIntoView({
                behavior:"smooth"
              });

          }

        },100);

      };


      grid.appendChild(item);

    });

}


/* =========================================================
   HOME
========================================================= */

function showHome(){

  document
    .getElementById("discover")
    .style.display = "none";


  document
    .getElementById("feed")
    .scrollTo({
      top:0,
      behavior:"smooth"
    });

}

}

   LIVE

function showLive(){

    "APEX LIVE is ready for the live-stream system 🔴"
  );

}


/* =========================================================
   INBOX
========================================================= */

function openInbox(){

  if(!currentUser){

    toast(
      "Log in to open your APEX inbox."
    );

    openAuth();

    return;

  }


  toast(
    "APEX Inbox opened 💬"
  );

}


/* =========================================================
   PROFILE
========================================================= */

function toggleProfile(){

  const panel =
    document
      .getElementById("profilePanel");


  panel.style.display =
    panel.style.display === "block"
    ? "none"
    : "block";

}


function showMyPosts(){

  if(!currentUser){

    toast("Log in first.");

    openAuth();

    return;

  }


  document
    .getElementById("profilePanel")
    .style.display = "none";


  const mine =
    posts.filter(
      post =>
        String(post.user_id)
        === String(currentUser.id)
    );


  renderFeed(mine);

}


/* =========================================================
   PAYSTACK
========================================================= */

function checkout(){

  window.location.href =
    PAYSTACK_LINK;

}


/* =========================================================
   KEYBOARD / MODAL BEHAVIOR
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      closeCreate();

      closeAuth();

      closeComments();

      document
        .getElementById("profilePanel")
        .style.display = "none";

      document
        .getElementById("discover")
        .style.display = "none";

    }

  }
);


/* =========================================================
   START APEX
========================================================= */

async function startAPEX(){

  try{

    updateProfileUI();

    await loadSession();

    await loadPosts();

  }catch(error){

    console.error(
      "APEX startup error:",
      error
    );

  }finally{

    document
      .getElementById("loading")
      .style.display = "none";

  }

}


startAPEX();

</script>
